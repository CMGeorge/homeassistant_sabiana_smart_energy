name: Release workflow

# Runs when a release is published by hand in the GitHub UI. Releases made by
# the "Beta release" / "Stable release" workflows already upload the zip
# (releases created with GITHUB_TOKEN do not trigger this workflow).

on:
  release:
    types:
      - published

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Get release version
        id: version
        uses: home-assistant/actions/helpers/version@master

      - name: Validate data
        run: |
          manifestversion=$(jq -r '.version' ${{ github.workspace }}/custom_components/sabiana_energy_smart/manifest.json)
          if [ "$manifestversion" != "${{ steps.version.outputs.version }}" ]; then
            echo "The version in custom_components/sabiana_energy_smart/manifest.json was not correct"
            echo "$manifestversion"
            exit 1
          fi

      - name: Create zip file for the integration
        run: |
          cd "${{ github.workspace }}/custom_components/sabiana_energy_smart"
          zip sabiana_energy_smart.zip -r ./

      - name: Upload the zipfile as a release asset
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: ${{ github.workspace }}/custom_components/sabiana_energy_smart/sabiana_energy_smart.zip
